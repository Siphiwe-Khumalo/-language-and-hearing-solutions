<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="lhsLogoTitle">
  <title id="lhsLogoTitle">Language and Hearing Solutions logo mark: a stylised human profile, sound wave and ear within a teal ring</title>
  <!-- Outer teal ring, open on the right where the ear sits -->
  <path d="M197.8,174.5 A95,95 0 1 1 197.8,65.5" fill="none" stroke="#0F6E6A" stroke-width="9" stroke-linecap="round"/>

  <!-- Face profile silhouette, facing right toward the ear -->
  <path d="M60,60
           C40,65 30,85 32,105
           C33,118 40,128 48,133
           C44,140 44,148 50,154
           C55,159 63,158 67,152
           C75,162 90,168 108,168
           C115,168 118,163 114,157
           C126,153 138,145 145,133
           C150,124 148,113 140,107
           C144,100 144,92 138,87
           C142,80 140,72 132,68
           C120,58 100,54 84,55
           C76,55 68,57 60,60 Z"
        fill="#0B4A47"/>

  <!-- Sound wave bars between the mouth and the ear -->
  <rect x="148" y="115" width="5" height="10" rx="2.5" fill="#0F6E6A"/>
  <rect x="157" y="109" width="5" height="22" rx="2.5" fill="#0F6E6A"/>
  <rect x="166" y="112" width="5" height="16" rx="2.5" fill="#0F6E6A"/>
  <rect x="175" y="116" width="5" height="8" rx="2.5" fill="#0F6E6A"/>

  <!-- Ear glyph -->
  <path d="M178,80
           C203,80 213,100 208,120
           C205,133 193,140 186,150
           C181,157 183,165 190,168
           C196,170 203,166 204,160"
        fill="none" stroke="#0F6E6A" stroke-width="6" stroke-linecap="round"/>
  <path d="M186,100 C196,102 198,113 190,118 C184,121 180,116 182,110"
        fill="none" stroke="#0F6E6A" stroke-width="5" stroke-linecap="round"/>
</svg>
